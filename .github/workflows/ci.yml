name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare API keys
        # 저장소에는 커밋되지 않는 로컬 설정 파일 (APIKeys.swift.template은 플레이스홀더만 있음).
        # 여기 들어가는 키는 CLAUDE.md에도 평문으로 적혀 있는 공개된 비공식 Riot Esports API 키라
        # GitHub Secrets 처리가 필요 없다 (진짜 민감한 키를 추가할 땐 secrets로 전환할 것).
        run: |
          cat > LOLIVE/APIKeys.swift <<'EOF'
          enum APIKeys {
              static let riotApiKey = "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"
          }
          EOF
          cp LOLIVE/APIKeys.swift LOLIVEWidgets/APIKeys.swift

      - name: Prepare Firebase config
        # GoogleService-Info.plist도 저장소엔 커밋 안 됨 (.gitignore). 이게 없으면 앱이 시작할 때
        # AppDelegate의 FirebaseApp.configure()가 즉시 크래시해서 테스트가 전부 실행도 못 됨.
        # 값 자체는 클라이언트 설정 파일이라 민감정보 아님(Firebase 보안은 Firestore 규칙/Cloud
        # Functions 쪽에서 처리) — Riot 키와 동일한 이유로 GitHub Secrets 불필요.
        run: |
          cat > LOLIVE/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>API_KEY</key>
          	<string>AIzaSyD0Jo1iiDfBPh0oY6CCvmMayIfEagamRa8</string>
          	<key>GCM_SENDER_ID</key>
          	<string>360576014333</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>com.ian.jiwonkim.LOLIVE</string>
          	<key>PROJECT_ID</key>
          	<string>lolive-967cb</string>
          	<key>STORAGE_BUCKET</key>
          	<string>lolive-967cb.firebasestorage.app</string>
          	<key>IS_ADS_ENABLED</key>
          	<false></false>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false></false>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true></true>
          	<key>IS_GCM_ENABLED</key>
          	<true></true>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true></true>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:360576014333:ios:478743fcc30c1ed619ab94</string>
          </dict>
          </plist>
          EOF

      - name: Pick an available iOS Simulator
        # 러너에 설치된 Xcode/시뮬레이터 버전이 바뀌어도 안 깨지도록
        # 기종을 하드코딩하지 않고 그때그때 설치된 iPhone 시뮬레이터를 simctl로 직접 조회한다.
        # (xcodebuild -showdestinations 기반은 러너 환경에서 매칭 실패 이력이 있어 더 안정적인 방식으로 교체)
        run: |
          NAME=$(xcrun simctl list devices available 2>/dev/null | grep -o 'iPhone[^(]*' | head -1 | sed 's/[[:space:]]*$//')
          if [ -z "$NAME" ]; then
            echo "iPhone 시뮬레이터를 찾지 못했습니다. 사용 가능한 기기 목록:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "선택된 시뮬레이터: $NAME"
          echo "SIMULATOR_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Run LOLIVETests (44 cases)
        run: |
          xcodebuild test \
            -scheme LOLIVE \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -only-testing:LOLIVETests

      - name: Build widget extension
        # 위젯 타겟은 별도 스킴이라 위 테스트 빌드에 포함되지 않는다.
        # 테스트는 없지만 컴파일이 깨지는지는 여기서 잡는다.
        run: |
          xcodebuild build \
            -scheme LOLIVEWidgetsExtension \
            -destination "generic/platform=iOS Simulator"
